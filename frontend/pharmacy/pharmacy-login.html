<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Pharmacy Login - MediMate AI</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #050a14;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(236, 72, 153, 0.08), transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(0, 229, 153, 0.08), transparent 40%);
      background-attachment: fixed;
      color: #f8fafc;
      -webkit-font-smoothing: antialiased;
      padding: 20px;
    }

    .login-container {
      width: 420px;
      max-width: 100%;
      background: rgba(13, 22, 41, 0.85);
      padding: 40px 35px;
      border-radius: 28px;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8), 0 0 40px rgba(236, 72, 153, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      text-align: center;
      animation: fadeIn 0.8s ease-in-out;
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 18px;
      border-radius: 20px;
      background: linear-gradient(135deg, #ec4899, #00e599);
      color: #050a14;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 800;
      box-shadow: 0 0 25px rgba(236, 72, 153, 0.4);
    }

    h2 {
      color: #ffffff;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .input-group {
      text-align: left;
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px 16px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      outline: none;
      font-size: 14px;
      background: rgba(10, 18, 36, 0.85);
      color: #ffffff;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    input:focus {
      border-color: #ec4899;
      box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.2);
      background: rgba(13, 24, 48, 0.95);
    }

    .remember-row {
      display: flex;
      align-items: center;
      gap: 8px;
      text-align: left;
      margin-bottom: 15px;
      font-size: 13px;
      color: #94a3b8;
    }

    .remember-row input {
      width: auto;
      accent-color: #ec4899;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #ec4899, #db2777);
      color: white;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-top: 8px;
      box-shadow: 0 4px 20px rgba(236, 72, 153, 0.35);
    }

    button:hover {
      background: linear-gradient(135deg, #f472b6, #ec4899);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(236, 72, 153, 0.5);
    }

    .message {
      margin-top: 15px;
      font-size: 14px;
      min-height: 18px;
    }

    .register-text {
      margin-top: 20px;
      font-size: 13px;
      color: #94a3b8;
    }

    .register-text a,
    .back-link {
      color: #ec4899;
      text-decoration: none;
      font-weight: 700;
    }

    .register-text a:hover,
    .back-link:hover {
      text-decoration: underline;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      font-size: 14px;
      font-weight: normal;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <div class="login-container">
    <div class="logo">💊</div>

    <h2>Pharmacy Login</h2>

    <p class="subtitle">
      Welcome to MediMate AI Pharmacy Portal
    </p>

    <form id="pharmacyLoginForm">
      <div class="input-group">
        <label for="email">Pharmacy Email</label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter registered pharmacy email"
          required
        />
      </div>

      <div class="input-group">
        <label for="password">Password</label>

        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          required
        />
      </div>

      <div class="remember-row">
        <input type="checkbox" id="rememberMe" />
        <label for="rememberMe">Remember my email</label>
      </div>

      <button type="submit">Login</button>

      <p class="message" id="message"></p>
    </form>

    <p class="register-text">
      New pharmacy user?
      <a href="../register.html">Register here</a>
    </p>

    <a href="../index.html" class="back-link">
      ← Back to Home
    </a>
  </div>

  <script>
    const loginForm = document.getElementById("pharmacyLoginForm");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const rememberMe = document.getElementById("rememberMe");
    const message = document.getElementById("message");

    const rememberedEmail =
      localStorage.getItem("pharmacyRememberedEmail");

    if (rememberedEmail) {
      emailInput.value = rememberedEmail;
      rememberMe.checked = true;
    }

    loginForm.addEventListener("submit", function (event) {
      event.preventDefault();

      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;

      const users =
        JSON.parse(localStorage.getItem("medimateUsers")) || [];

      const pharmacyUser = users.find(function (user) {
        return (
          String(user.email || "").trim().toLowerCase() === email &&
          String(user.password || "") === password &&
          String(user.role || "").trim().toLowerCase() === "pharmacy"
        );
      });

      if (pharmacyUser) {
        if (rememberMe.checked) {
          localStorage.setItem(
            "pharmacyRememberedEmail",
            email
          );
        } else {
          localStorage.removeItem("pharmacyRememberedEmail");
        }

        localStorage.setItem(
          "currentUser",
          JSON.stringify(pharmacyUser)
        );

        sessionStorage.setItem("userRole", "pharmacy");
        sessionStorage.setItem(
          "userName",
          pharmacyUser.name || "Pharmacy User"
        );

        message.style.color = "green";
        message.textContent = "Login successful!";

        setTimeout(function () {
          window.location.href = "dashboard.html";
        }, 800);
      } else {
        message.style.color = "red";
        message.textContent =
          "Invalid registered pharmacy email or password. Please register first.";
      }
    });
  </script>
</body>
</html>
